name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: marinaflow
          POSTGRES_PASSWORD: marinaflow
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marinaflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          # As mesmas extensões confirmadas no runtime de produção.
          extensions: pdo_sqlite, pdo_pgsql, gd, intl, zip, exif, fileinfo
          coverage: none

      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: vendor/bin/pint --test

      - name: Tests (SQLite)
        run: php artisan test

      # RF-01.7: o mesmo dialeto de produção, para divergência falhar aqui e não no deploy.
      - name: Tests (PostgreSQL 16)
        run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: marinaflow
          DB_PASSWORD: marinaflow
          DB_SSLMODE: disable

  js:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # vitest, jsdom e jest-dom exigem Node 22+.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
